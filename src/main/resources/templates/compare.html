<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean: #1c2b3a; --ocean-deep: #121b24;
            --land-eu: #b8945f; --cream: #ede7da;
        }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 90px 24px 80px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 32px; margin: 10px 0 24px; }
        .picker { display: flex; gap: 12px; align-items: center; margin-bottom: 32px; }
        select, button {
            font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; padding: 8px 12px;
            border-radius: 3px; border: 1px solid rgba(237,231,218,0.25);
            background: var(--ocean-deep); color: var(--cream);
        }
        button { background: var(--land-eu); color: var(--ocean-deep); font-weight: 500; cursor: pointer; border: none; }
        .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
        .column h2 { font-family: 'Source Serif 4', serif; font-size: 24px; margin-bottom: 4px; }
        .badges { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 3px; background: var(--ocean-deep); }
        .badge.yes { color: var(--land-eu); }
        .badge.no { color: #6b7378; }
        section { margin-bottom: 24px; }
        section h3 { font-size: 14px; opacity: 0.7; border-bottom: 1px solid rgba(237,231,218,0.15); padding-bottom: 6px; }
        .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .empty { color: #6b7378; font-size: 13px; font-style: italic; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="wrap">
    <h1>Compare countries</h1>
    <div class="picker">
        <select id="countryA"></select>
        <span>vs</span>
        <select id="countryB"></select>
        <button onclick="runCompare()">Compare</button>
    </div>
    <div class="columns" id="results"></div>
</div>

<script>
    function badge(label, value) {
        return `<span class="badge ${value ? 'yes' : 'no'}">${label}</span>`;
    }

    function row(label, value) {
        return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
    }

    function renderColumn(profile) {
        const c = profile.country;
        return `
                <div class="column">
                    <h2>${c.name}</h2>
                    <div class="badges">
                        ${badge('EU', c.euMember)}${badge('Schengen', c.schengenMember)}
                        ${badge('Eurozone', c.eurozoneMember)}${badge('NATO', c.natoMember)}
                    </div>
                    <section>
                        <h3>Political parties (${profile.politicalParties.length})</h3>
                        ${profile.politicalParties.length ? profile.politicalParties.map(p => row(p.name, p.politicalGroup || '')).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>
                    <section>
                        <h3>Elections (${profile.elections.length})</h3>
                        ${profile.elections.length ? profile.elections.map(e => row(e.name, e.electionDate)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>
                    <section>
                        <h3>MEPs (${profile.meps.length})</h3>
                        ${profile.meps.length ? profile.meps.map(m => row(m.fullName, m.politicalGroup || '')).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>
                    <section>
                        <h3>Statistics (${profile.statistics.length})</h3>
                        ${profile.statistics.length ? profile.statistics.map(s => row(`${s.indicator} (${s.year})`, `${s.value ?? ''} ${s.unit || ''}`)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>
                </div>
            `;
    }

    function runCompare() {
        const a = document.getElementById('countryA').value;
        const b = document.getElementById('countryB').value;
        if (a === b) {
            document.getElementById('results').innerHTML = '<p>Pick two different countries.</p>';
            return;
        }
        fetch(`/api/countries/compare?a=${a}&b=${b}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('results').innerHTML =
                    renderColumn(data.countryA) + renderColumn(data.countryB);
            });
    }

    fetch('/api/countries')
        .then(res => res.json())
        .then(data => {
            const options = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('countryA').innerHTML = options;
            document.getElementById('countryB').innerHTML = options;
        });
</script>
</body>
</html>
