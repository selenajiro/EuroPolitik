<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — Timeline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --ocean: #1c2b3a; --ocean-deep: #121b24; --land-eu: #b8945f; --cream: #ede7da; }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 90px 24px 80px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 32px; margin-bottom: 32px; }
        .year { font-family: 'Source Serif 4', serif; font-size: 22px; color: var(--land-eu); margin: 32px 0 12px; }
        .event { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(237,231,218,0.06); }
        .event .date { flex-shrink: 0; width: 90px; font-size: 13px; opacity: 0.6; }
        .event .body .title { font-size: 14px; margin-bottom: 4px; }
        .event .body .meta { font-size: 12px; opacity: 0.6; }
        .event .body .meta a { color: var(--land-eu); text-decoration: none; }
        .empty { color: #6b7378; font-style: italic; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<script src="/js/auth.js"></script>

<div class="wrap">
    <h1>Political timeline</h1>
    <div id="content">Loading...</div>
</div>

<script>
    fetch('/api/political-events')
        .then(res => {
            if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
            return res.json();
        })
        .then(events => {
            const content = document.getElementById('content');

            if (events.length === 0) {
                content.innerHTML = '<div class="empty">No events recorded yet</div>';
                return;
            }

            let html = '';
            let currentYear = null;

            events.forEach(e => {
                const year = e.eventDate.slice(0, 4);
                if (year !== currentYear) {
                    currentYear = year;
                    html += `<div class="year">${year}</div>`;
                }
                const countryLink = e.countryId
                    ? `<a href="/countries/${e.countryId}">${e.countryName}</a>`
                    : 'No country';
                html += `
                        <div class="event">
                            <div class="date">${e.eventDate}</div>
                            <div class="body">
                                <div class="title">${e.title}</div>
                                <div class="meta">${e.eventType} &middot; ${countryLink}</div>
                            </div>
                        </div>
                    `;
            });

            content.innerHTML = html;
        })
        .catch(err => {
            document.getElementById('content').innerHTML = `<div class="empty">Couldn't load: ${err.message}</div>`;
        });
</script>
</body>
</html>
