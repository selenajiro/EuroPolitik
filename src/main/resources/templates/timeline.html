<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — Timeline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --ocean: #1c2b3a; --ocean-deep: #121b24; --land-eu: #b8945f; --cream: #ede7da; }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 90px 24px 80px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 32px; margin-bottom: 8px; }
        .subtitle { font-size: 13px; opacity: 0.6; margin-bottom: 24px; }
        .controls { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
        .controls input, .controls select {
            background: var(--ocean-deep); border: 1px solid rgba(237,231,218,0.15);
            color: var(--cream); padding: 8px 12px; border-radius: 3px; font-size: 13px;
            font-family: 'IBM Plex Sans', sans-serif;
        }
        .controls input { flex: 1; min-width: 180px; }
        .controls input::placeholder { color: #7a838a; }
        .year { font-family: 'Source Serif 4', serif; font-size: 22px; color: var(--land-eu); margin: 32px 0 12px; }
        .year:first-of-type { margin-top: 8px; }
        .post { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgba(237,231,218,0.06); }
        .post .date-col { flex-shrink: 0; width: 84px; font-size: 12px; opacity: 0.6; padding-top: 2px; }
        .post .flag { width: 32px; height: 22px; object-fit: cover; border-radius: 2px; flex-shrink: 0; margin-top: 1px; background: rgba(237,231,218,0.08); }
        .post .body { flex: 1; min-width: 0; }
        .post .title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .post .badge { background: rgba(184,148,95,0.18); color: var(--land-eu); padding: 2px 8px; border-radius: 10px; font-size: 11px; flex-shrink: 0; }
        .post .title { font-size: 15px; }
        .post .snippet { font-size: 13px; opacity: 0.75; line-height: 1.45; margin: 4px 0 6px; }
        .post .links { display: flex; gap: 14px; }
        .post .links a { font-size: 12px; color: var(--land-eu); text-decoration: none; }
        .sentinel { height: 1px; }
        .loading-more { text-align: center; font-size: 13px; opacity: 0.6; padding: 20px 0; }
        .empty { color: #6b7378; font-style: italic; padding: 20px 0; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<div class="wrap">
    <h1>Timeline</h1>
    <div class="subtitle">The full historical log across all 47 countries &mdash; every election, referendum, and political event on record.</div>

    <div class="controls">
        <input type="text" id="search-input" placeholder="Search titles...">
        <input type="date" id="date-from-input" title="From date">
        <input type="date" id="date-to-input" title="To date">
        <select id="country-select"><option value="">All countries</option></select>
        <select id="type-select">
            <option value="">All types</option>
            <option value="ELECTION">Election results</option>
            <option value="ELECTION_HELD">National elections</option>
            <option value="REGIONAL_ELECTION_HELD">Regional elections</option>
            <option value="LOCAL_ELECTION_HELD">Local elections</option>
            <option value="BY_ELECTION_HELD">By-elections</option>
            <option value="PARTY_LEADERSHIP_ELECTION">Leadership elections</option>
            <option value="REFERENDUM_HELD">Referendums</option>
            <option value="GOVERNMENT_CHANGE">Government changes</option>
        </select>
    </div>

    <div id="content">Loading...</div>
    <div class="sentinel" id="sentinel"></div>
    <div class="loading-more" id="loading-more" style="display: none;">Loading more...</div>
</div>

<script>
    const EVENT_TYPE_LABELS = {
        'ELECTION': 'Election result',
        'ELECTION_HELD': 'National election',
        'PARTY_LEADERSHIP_ELECTION': 'Leadership election',
        'REFERENDUM_HELD': 'Referendum',
        'REGIONAL_ELECTION_HELD': 'Regional election',
        'LOCAL_ELECTION_HELD': 'Local election',
        'BY_ELECTION_HELD': 'By-election',
        'GOVERNMENT_CHANGE': 'Government change'
    };

    const LIMIT = 20;
    let offset = 0;
    let loading = false;
    let finished = false;
    let itemCount = 0;
    let currentYear = null;
    let debounceTimer = null;

    function buildQuery() {
        const params = new URLSearchParams({ offset: String(offset), limit: String(LIMIT) });
        const search = document.getElementById('search-input').value.trim();
        const country = document.getElementById('country-select').value;
        const type = document.getElementById('type-select').value;
        const dateFrom = document.getElementById('date-from-input').value;
        const dateTo = document.getElementById('date-to-input').value;
        if (search) params.set('search', search);
        if (country) params.set('countryId', country);
        if (type) params.set('type', type);
        if (dateFrom) params.set('dateFrom', dateFrom);
        if (dateTo) params.set('dateTo', dateTo);
        return params.toString();
    }

    function renderPost(item) {
        const label = EVENT_TYPE_LABELS[item.type] || item.type;
        const flag = item.countryIsoCode
            ? `<img class="flag" src="https://flagcdn.com/w40/${item.countryIsoCode.toLowerCase()}.png" alt="">`
            : '';
        return `
                <div class="post">
                    <div class="date-col">${item.date}</div>
                    <div class="body">
                        <div class="title-row">
                            ${flag}
                            <span class="badge">${label}</span>
                            <span class="title">${item.title}</span>
                        </div>
                        ${item.description ? `<div class="snippet">${item.description}</div>` : ''}
                        <div class="links">
                            ${item.countryId ? `<a href="/countries/${item.countryId}">${item.countryName || 'Country profile'} &rarr;</a>` : ''}
                            ${item.sourceUrl ? `<a href="${item.sourceUrl}" target="_blank" rel="noopener">Read more &#8599;</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
    }

    function appendItems(items) {
        const content = document.getElementById('content');
        items.forEach(item => {
            const year = item.date.slice(0, 4);
            if (year !== currentYear) {
                currentYear = year;
                content.insertAdjacentHTML('beforeend', `<div class="year">${year}</div>`);
            }
            content.insertAdjacentHTML('beforeend', renderPost(item));
            itemCount++;
        });
    }

    function loadMore() {
        if (loading || finished) return;
        loading = true;
        if (itemCount > 0) document.getElementById('loading-more').style.display = 'block';

        fetch(`/api/timeline?${buildQuery()}`)
            .then(res => {
                if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
                return res.json();
            })
            .then(data => {
                document.getElementById('loading-more').style.display = 'none';

                if (itemCount === 0 && data.items.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="empty">No matching events found.</div>';
                    finished = true;
                    return;
                }

                if (itemCount === 0) {
                    document.getElementById('content').innerHTML = '';
                }

                appendItems(data.items);
                offset += data.items.length;
                finished = !data.hasMore;
                loading = false;
            })
            .catch(err => {
                loading = false;
                document.getElementById('loading-more').style.display = 'none';
                if (itemCount === 0) {
                    document.getElementById('content').innerHTML = `<div class="empty">Couldn't load: ${err.message}</div>`;
                }
            });
    }

    function resetAndReload() {
        offset = 0;
        itemCount = 0;
        currentYear = null;
        finished = false;
        document.getElementById('content').innerHTML = 'Loading...';
        loadMore();
    }

    document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(resetAndReload, 350);
    });
    document.getElementById('country-select').addEventListener('change', resetAndReload);
    document.getElementById('type-select').addEventListener('change', resetAndReload);
    document.getElementById('date-from-input').addEventListener('change', resetAndReload);
    document.getElementById('date-to-input').addEventListener('change', resetAndReload);

    fetch('/api/countries')
        .then(res => res.json())
        .then(countries => {
            const select = document.getElementById('country-select');
            countries.sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
                select.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.name}</option>`);
            });
        });

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
            loadMore();
        }
    });
    observer.observe(document.getElementById('sentinel'));
</script>
</body>
</html>
