<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --ocean: #1c2b3a;
            --ocean-deep: #121b24;
            --land-base: #9c9186;
            --land-eu: #b8945f;
            --highlight: #7a3b4a;
            --cream: #ede7da;
        }
        html, body { margin: 0; padding: 0; height: 100%; font-family: 'IBM Plex Sans', sans-serif; }
        .layout { display: flex; height: 100vh; }
        #map { flex: 1; height: 100vh; background: var(--ocean); }
        .leaflet-container { background: var(--ocean); }

        .sidebar {
            width: 480px; flex-shrink: 0; height: 100vh; overflow-y: auto;
            background: var(--ocean-deep); color: var(--cream);
            padding: 90px 24px 24px; box-sizing: border-box;
            border-left: 1px solid rgba(237,231,218,0.08);
        }
        .sidebar h2 { font-family: 'Source Serif 4', serif; font-size: 18px; margin: 0 0 16px; }
        .sidebar .feed-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(237,231,218,0.08); }
        .sidebar .feed-item .flag { width: 34px; height: 23px; object-fit: cover; border-radius: 2px; flex-shrink: 0; margin-top: 2px; background: rgba(237,231,218,0.08); }
        .sidebar .feed-item .body { flex: 1; min-width: 0; }
        .sidebar .feed-item .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; opacity: 0.6; margin-bottom: 4px; flex-wrap: wrap; }
        .sidebar .feed-item .badge { background: rgba(184,148,95,0.18); color: var(--land-eu); padding: 1px 7px; border-radius: 8px; font-size: 10px; }
        .sidebar .feed-item .title { font-size: 14px; font-weight: 500; line-height: 1.35; margin-bottom: 4px; }
        .sidebar .feed-item .snippet { font-size: 12px; opacity: 0.75; line-height: 1.45; margin-bottom: 6px; }
        .sidebar .feed-item .links { display: flex; gap: 14px; }
        .sidebar .feed-item .links a { font-size: 12px; color: var(--land-eu); text-decoration: none; }
        .sidebar .feed-empty { padding: 20px 0; }
        .sidebar .feed-empty-title { font-family: 'Source Serif 4', serif; font-size: 16px; margin: 0 0 8px; }
        .sidebar .feed-empty-message { font-size: 13px; opacity: 0.7; line-height: 1.5; margin: 0; }
        .sidebar .loading-more { text-align: center; font-size: 12px; opacity: 0.6; padding: 14px 0; }
        .sidebar .sentinel { height: 1px; }

        .leaflet-top.leaflet-left { margin-top: 66px; }
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 20px rgba(0,0,0,0.35) !important; }
        .leaflet-control-zoom a {
            background: var(--ocean-deep) !important;
            color: var(--cream) !important;
            border: 1px solid rgba(237,231,218,0.15) !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--land-eu) !important;
            color: var(--ocean-deep) !important;
        }

        .layer-picker {
            position: absolute; left: 24px; z-index: 1000;
            background: var(--ocean-deep); border-radius: 3px; padding: 4px;
            display: flex; flex-wrap: wrap; gap: 2px; max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }
        .layer-btn {
            font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; padding: 6px 10px;
            border: none; background: transparent; color: var(--cream); opacity: 0.6;
            cursor: pointer; border-radius: 2px; white-space: nowrap;
        }
        .layer-btn.active { opacity: 1; background: rgba(184,148,95,0.2); color: var(--land-eu); }

        .legend {
            position: absolute; bottom: 24px; left: 24px; z-index: 1000;
            background: var(--ocean-deep); color: var(--cream);
            padding: 14px 18px; border-radius: 3px; font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            max-height: calc(100vh - 200px); overflow-y: auto;
        }
        .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .legend .swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
        .legend .gradient-label { font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
        .legend .gradient-bar { width: 160px; height: 10px; border-radius: 2px; margin-bottom: 4px; }
        .legend .gradient-range { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.7; width: 160px; margin-bottom: 6px; }

        .country-popup { font-family: 'IBM Plex Sans', sans-serif; min-width: 180px; }
        .country-popup .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .country-popup h3 {
            font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 18px;
            margin: 0; color: var(--ocean-deep);
        }
        .country-popup .fact { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
        .country-popup .fact .label { color: #6b6b6b; }
        .country-popup .fact .value { color: var(--ocean-deep); font-weight: 500; }
        .country-popup .fact .value.yes { color: var(--land-eu); font-weight: 500; }
        .country-popup .fact .value.no { color: #b7b0a8; }
        .country-popup .ruling-party { font-size: 12px; color: #5a5a5a; line-height: 1.4; padding: 2px 0 6px; }
        .country-popup a.profile-link { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--ocean-deep); font-weight: 500; }

        .leaflet-popup-content-wrapper { background: var(--cream); border-radius: 4px; }
        .leaflet-popup-tip { background: var(--cream); }

        .load-error {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; background: var(--ocean-deep); color: var(--cream);
            font-family: 'IBM Plex Sans', sans-serif; padding: 18px 26px; border-radius: 4px;
            max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<script src="/js/auth.js"></script>

<div class="layout">
    <div id="map"></div>
    <aside class="sidebar">
        <h2>Your feed</h2>
        <div id="feed-content">Loading...</div>
        <div class="sentinel" id="feed-sentinel"></div>
        <div class="loading-more" id="feed-loading-more" style="display: none;">Loading more...</div>
    </aside>
</div>

<div class="layer-picker">
    <button class="layer-btn active" data-layer="eu" onclick="switchLayer('eu')">EU</button>
    <button class="layer-btn" data-layer="schengen" onclick="switchLayer('schengen')">Schengen</button>
    <button class="layer-btn" data-layer="eurozone" onclick="switchLayer('eurozone')">Eurozone</button>
    <button class="layer-btn" data-layer="nato" onclick="switchLayer('nato')">NATO</button>
    <button class="layer-btn" data-layer="leaning" onclick="switchLayer('leaning')">Leaning</button>
    <button class="layer-btn" data-layer="population" onclick="switchLayer('population')">Population</button>
    <button class="layer-btn" data-layer="unemployment" onclick="switchLayer('unemployment')">Unemployment</button>
    <button class="layer-btn" data-layer="gdp" onclick="switchLayer('gdp')">GDP/capita</button>
</div>

<div class="legend" id="legend"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const europeBounds = L.latLngBounds([34, -45], [71, 35]);

    const map = L.map('map', {
        minZoom: 3,
        zoomSnap: 0.3,
        zoomDelta: 0.3,
        maxBounds: europeBounds.pad(0.25),
        maxBoundsViscosity: 1.0
    }).fitBounds(europeBounds);

    setTimeout(() => {
        map.invalidateSize();
        map.fitBounds(europeBounds);
    }, 100);

    const LAYERS = {
        eu: { type: 'boolean', label: 'EU member', otherLabel: 'Non-EU', property: 'euMember' },
        schengen: { type: 'boolean', label: 'Schengen member', otherLabel: 'Non-Schengen', property: 'schengenMember' },
        eurozone: { type: 'boolean', label: 'Eurozone member', otherLabel: 'Non-Eurozone', property: 'eurozoneMember' },
        nato: { type: 'boolean', label: 'NATO member', otherLabel: 'Non-NATO', property: 'natoMember' },
        leaning: { type: 'leaning', label: 'Political leaning', property: 'currentPoliticalLeaningLabel' },
        population: {
            type: 'continuous', label: 'Population', property: 'population', log: true,
            colors: ['#16202b', '#3d5a80', '#bcd4e6'], format: v => formatCompact(v)
        },
        unemployment: {
            type: 'continuous', label: 'Unemployment rate', property: 'unemploymentRate', log: false,
            colors: ['#e8dfc8', '#c17a4f', '#6b2737'], format: v => v.toFixed(1) + '%'
        },
        gdp: {
            type: 'continuous', label: 'GDP per capita', property: 'gdpPerCapita', log: true,
            colors: ['#e9e4d0', '#7a9463', '#2f4a2f'], format: v => '\u20ac' + formatCompact(v)
        }
    };
    let currentLayer = 'eu';
    let continuousStats = {};

    const LEANING_COLORS = {
        'Far Left': '#8b2635',
        'Left': '#b23a4e',
        'Center-Left': '#d68a95',
        'Center': '#e0d5bd',
        'Center-Right': '#8aa8c4',
        'Right': '#4a7ba6',
        'Far Right': '#234b6e'
    };
    const NO_DATA_COLOR = '#9c9186';

    const MICRO_COUNTRY_CODES = ['VA', 'SM', 'MC', 'LI', 'AD', 'MT'];

    let geoJsonLayer = null;
    let microMarkers = [];

    function formatCompact(v) {
        if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + 'M';
        if (v >= 1_000) return (v / 1_000).toFixed(0) + 'k';
        return String(Math.round(v));
    }

    function blendHex(a, b, t) {
        const av = parseInt(a.slice(1), 16), bv = parseInt(b.slice(1), 16);
        const ar = (av >> 16) & 255, ag = (av >> 8) & 255, ab = av & 255;
        const br = (bv >> 16) & 255, bg = (bv >> 8) & 255, bb = bv & 255;
        const r = Math.round(ar + (br - ar) * t);
        const g = Math.round(ag + (bg - ag) * t);
        const bl = Math.round(ab + (bb - ab) * t);
        return `#${[r, g, bl].map(x => x.toString(16).padStart(2, '0')).join('')}`;
    }

    function interpolateColor(colors, t) {
        const scaled = t * (colors.length - 1);
        const idx = Math.min(Math.floor(scaled), colors.length - 2);
        const frac = scaled - idx;
        return blendHex(colors[idx], colors[idx + 1], frac);
    }

    function computeContinuousStats(data) {
        ['population', 'unemployment', 'gdp'].forEach(key => {
            const layer = LAYERS[key];
            const values = data.features
                .map(f => f.properties[layer.property])
                .filter(v => v != null && !isNaN(v));
            continuousStats[key] = values.length ? { min: Math.min(...values), max: Math.max(...values) } : null;
        });
    }

    function colorForContinuous(layerKey, value) {
        const layer = LAYERS[layerKey];
        const stats = continuousStats[layerKey];
        if (value == null || isNaN(value) || !stats) return NO_DATA_COLOR;

        const toScale = v => layer.log ? Math.log(Math.max(v, 1)) : v;
        const lo = toScale(stats.min);
        const hi = toScale(stats.max);
        const t = hi === lo ? 1 : Math.max(0, Math.min(1, (toScale(value) - lo) / (hi - lo)));

        return interpolateColor(layer.colors, t);
    }

    function colorForProperties(p) {
        const layer = LAYERS[currentLayer];
        if (layer.type === 'leaning') {
            const label = p[layer.property];
            return (label && LEANING_COLORS[label]) ? LEANING_COLORS[label] : NO_DATA_COLOR;
        }
        if (layer.type === 'continuous') {
            return colorForContinuous(currentLayer, p[layer.property]);
        }
        return p[layer.property] ? '#b8945f' : '#9c9186';
    }

    function fact(label, value) {
        return `<div class="fact"><span class="label">${label}</span><span class="value ${value ? 'yes' : 'no'}">${value ? 'Yes' : 'No'}</span></div>`;
    }

    function buildPopupContent(p, isFavorited) {
        let extra = '';
        if (p.currentRulingParty) {
            const isCoalition = p.currentRulingParty.includes(',');
            const label = isCoalition ? 'Governing coalition' : 'Governed by';
            extra += `<div class="ruling-party">${label}: ${p.currentRulingParty}</div>`;
        }
        if (p.currentPoliticalLeaningLabel) {
            const score = p.currentPoliticalLeaning != null ? ` (${p.currentPoliticalLeaning})` : '';
            extra += `<div class="fact"><span class="label">Leaning</span><span class="value">${p.currentPoliticalLeaningLabel}${score}</span></div>`;
        }
        if (p.population != null) {
            extra += `<div class="fact"><span class="label">Population${p.populationYear ? ` (${p.populationYear})` : ''}</span><span class="value">${formatCompact(p.population)}</span></div>`;
        }
        if (p.unemploymentRate != null) {
            extra += `<div class="fact"><span class="label">Unemployment${p.unemploymentRateYear ? ` (${p.unemploymentRateYear})` : ''}</span><span class="value">${Number(p.unemploymentRate).toFixed(1)}%</span></div>`;
        }
        if (p.gdpPerCapita != null) {
            extra += `<div class="fact"><span class="label">GDP/capita${p.gdpPerCapitaYear ? ` (${p.gdpPerCapitaYear})` : ''}</span><span class="value">\u20ac${formatCompact(p.gdpPerCapita)}</span></div>`;
        }

        return `
                <div class="country-popup">
                    <div class="popup-header">
                        <h3>${p.name}</h3>
                        ${starButton(p.id, isFavorited)}
                    </div>
                    ${fact('EU member', p.euMember)}
                    ${fact('Schengen', p.schengenMember)}
                    ${fact('Eurozone', p.eurozoneMember)}
                    ${fact('NATO', p.natoMember)}
                    ${extra}
                    <a class="profile-link" href="/countries/${p.id}">Full profile &rarr;</a>
                </div>
            `;
    }

    function styleForFeature(feature) {
        return {
            color: '#1c2b3a',
            weight: 1,
            fillColor: colorForProperties(feature.properties),
            fillOpacity: 0.9
        };
    }

    function updateLegend() {
        const legend = document.getElementById('legend');
        const layer = LAYERS[currentLayer];

        if (layer.type === 'leaning') {
            legend.innerHTML = Object.entries(LEANING_COLORS).map(([label, color]) => `
                    <div><span class="swatch" style="background: ${color}"></span><span>${label}</span></div>
                `).join('') + `
                    <div><span class="swatch" style="background: ${NO_DATA_COLOR}"></span><span>No data</span></div>
                `;
        } else if (layer.type === 'continuous') {
            const stats = continuousStats[currentLayer];
            if (stats) {
                legend.innerHTML = `
                        <div class="gradient-label">${layer.label}</div>
                        <div class="gradient-bar" style="background: linear-gradient(to right, ${layer.colors.join(', ')})"></div>
                        <div class="gradient-range"><span>${layer.format(stats.min)}</span><span>${layer.format(stats.max)}</span></div>
                        <div><span class="swatch" style="background: ${NO_DATA_COLOR}"></span><span>No data</span></div>
                    `;
            } else {
                legend.innerHTML = `<div class="gradient-label">${layer.label}</div><div class="empty">No data yet</div>`;
            }
        } else {
            legend.innerHTML = `
                    <div><span class="swatch" style="background: #b8945f"></span><span>${layer.label}</span></div>
                    <div><span class="swatch" style="background: #9c9186"></span><span>${layer.otherLabel}</span></div>
                `;
        }

        requestAnimationFrame(() => {
            const picker = document.querySelector('.layer-picker');
            picker.style.bottom = (24 + legend.offsetHeight + 16) + 'px';
        });
    }

    function switchLayer(layerKey) {
        currentLayer = layerKey;

        document.querySelectorAll('.layer-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.layer === layerKey);
        });

        if (geoJsonLayer) {
            geoJsonLayer.setStyle(styleForFeature);
        }

        microMarkers.forEach(({ marker, properties }) => {
            marker.setStyle({ fillColor: colorForProperties(properties) });
        });

        updateLegend();
    }

    function addMicroMarkers(data, favoriteIds) {
        data.features.forEach(feature => {
            const p = feature.properties;
            if (!MICRO_COUNTRY_CODES.includes(p.isoCode)) return;
            if (p.centroidLat == null || p.centroidLng == null) return;

            const marker = L.circleMarker([p.centroidLat, p.centroidLng], {
                radius: 6,
                color: '#ede7da',
                weight: 1.5,
                fillColor: colorForProperties(p),
                fillOpacity: 1
            }).addTo(map);

            marker.bindPopup(buildPopupContent(p, favoriteIds.has(p.id)));
            microMarkers.push({ marker, properties: p });
        });
    }

    updateLegend();

    fetchFavoriteIds().then(favoriteIds => {
        fetch('/api/countries/geojson')
            .then(res => {
                if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
                return res.json();
            })
            .then(data => {
                if (!data.features || data.features.length === 0) {
                    throw new Error('Response had no country features');
                }
                computeContinuousStats(data);
                if (currentLayer !== 'eu') updateLegend();

                geoJsonLayer = L.geoJSON(data, {
                    style: styleForFeature,
                    onEachFeature: (feature, lyr) => {
                        const p = feature.properties;
                        lyr.bindPopup(buildPopupContent(p, favoriteIds.has(p.id)));
                        lyr.on('mouseover', () => lyr.setStyle({ fillColor: '#7a3b4a' }));
                        lyr.on('mouseout', () => lyr.setStyle({ fillColor: colorForProperties(p) }));
                    }
                }).addTo(map);

                addMicroMarkers(data, favoriteIds);
            })
            .catch(err => {
                document.body.insertAdjacentHTML('beforeend',
                    `<div class="load-error">Couldn't load country data: ${err.message}</div>`);
                console.error('GeoJSON fetch failed:', err);
            });
    });

    // ---- Feed: infinite scroll inside the sidebar itself ----

    const EVENT_TYPE_LABELS = {
        'ELECTION': 'Election result',
        'ELECTION_HELD': 'Election',
        'PARTY_LEADERSHIP_ELECTION': 'Leadership election',
        'REFERENDUM_HELD': 'Referendum',
        'REGIONAL_ELECTION_HELD': 'Regional election',
        'LOCAL_ELECTION_HELD': 'Local election',
        'BY_ELECTION_HELD': 'By-election',
        'GOVERNMENT_CHANGE': 'Government change'
    };

    let feedOffset = 0;
    const FEED_LIMIT = 10;
    let feedLoading = false;
    let feedFinished = false;
    let feedItemCount = 0;

    function renderFeedPost(item) {
        const label = EVENT_TYPE_LABELS[item.type] || item.type;
        return `
                <div class="feed-item">
                    ${item.countryIsoCode ? `<img class="flag" src="https://flagcdn.com/w80/${item.countryIsoCode.toLowerCase()}.png" alt="">` : ''}
                    <div class="body">
                        <div class="meta">
                            <span class="badge">${label}</span>
                            <span>${item.date}${item.countryName ? ` &middot; ${item.countryName}` : ''}</span>
                        </div>
                        <div class="title">${item.title}</div>
                        ${item.description ? `<div class="snippet">${item.description}</div>` : ''}
                        <div class="links">
                            ${item.countryId ? `<a href="/countries/${item.countryId}">Country profile &rarr;</a>` : ''}
                            ${item.sourceUrl ? `<a href="${item.sourceUrl}" target="_blank" rel="noopener">Read more &#8599;</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
    }

    function showFeedEmptyState(title, message) {
        document.getElementById('feed-content').innerHTML = `
                <div class="feed-empty">
                    <p class="feed-empty-title">${title}</p>
                    <p class="feed-empty-message">${message}</p>
                </div>
            `;
    }

    function loadMoreFeed() {
        if (feedLoading || feedFinished) return;
        feedLoading = true;
        if (feedItemCount > 0) document.getElementById('feed-loading-more').style.display = 'block';

        authFetch(`/api/feed/full?offset=${feedOffset}&limit=${FEED_LIMIT}`)
            .then(res => {
                if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
                return res.json();
            })
            .then(data => {
                document.getElementById('feed-loading-more').style.display = 'none';

                if (feedItemCount === 0 && data.items.length === 0) {
                    showFeedEmptyState("You're all caught up",
                        'No new activity for your followed countries right now, or you haven\'t favorited any yet — click the star on a country to follow it.');
                    feedFinished = true;
                    return;
                }

                if (feedItemCount === 0) {
                    document.getElementById('feed-content').innerHTML = '';
                }

                data.items.forEach(item => {
                    document.getElementById('feed-content').insertAdjacentHTML('beforeend', renderFeedPost(item));
                    feedItemCount++;
                });

                feedOffset += data.items.length;
                feedFinished = !data.hasMore;
                feedLoading = false;
            })
            .catch(err => {
                feedLoading = false;
                document.getElementById('feed-loading-more').style.display = 'none';
                if (feedItemCount === 0) {
                    showFeedEmptyState('Couldn\'t load', err.message);
                }
            });
    }

    if (!getToken()) {
        showFeedEmptyState('Log in to see your feed', 'Your feed shows new activity for the countries you follow once you\'re logged in.');
    } else {
        const feedObserver = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) {
                loadMoreFeed();
            }
        }, { root: document.querySelector('.sidebar') });
        feedObserver.observe(document.getElementById('feed-sentinel'));
    }
</script>
</body>
</html>
