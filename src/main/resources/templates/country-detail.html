<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — Country</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean: #1c2b3a;
            --ocean-deep: #121b24;
            --land-eu: #b8945f;
            --land-base: #9c9186;
            --cream: #ede7da;
        }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 90px 24px 80px; }
        .title-row { display: flex; align-items: center; gap: 14px; margin: 10px 0 6px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 36px; margin: 0; }
        .meta-line { font-size: 13px; opacity: 0.6; margin-bottom: 20px; }
        .badges { display: flex; gap: 8px; margin-bottom: 32px; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 3px; background: var(--ocean-deep); }
        .badge.yes { color: var(--land-eu); }
        .badge.no { color: #6b7378; }
        section { margin-bottom: 36px; }
        section h2 { font-family: 'Source Serif 4', serif; font-size: 20px; border-bottom: 1px solid rgba(237,231,218,0.15); padding-bottom: 8px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(237,231,218,0.06); }
        .row .muted { color: #9aa3a8; }
        .flowing-list a { color: var(--land-eu); text-decoration: none; }
        .flowing-list span.plain { color: var(--cream); opacity: 0.8; }
        .empty { color: #6b7378; font-size: 14px; font-style: italic; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<script src="/js/auth.js"></script>
<div class="wrap" id="content">
    <div id="loading">Loading...</div>
</div>

<div id="country-id-holder" th:attr="data-country-id=${countryId}" style="display:none"></div>

<script>
    const id = document.getElementById('country-id-holder').dataset.countryId;

    function row(label, value) {
        return `<div class="row"><span class="muted">${label}</span><span>${value}</span></div>`;
    }

    function renderNeighborsFlowing(neighbors) {
        const linked = neighbors.neighborsInDataset.map(n => `<a href="/countries/${n.id}">${n.name}</a>`);
        const plain = neighbors.otherRealWorldNeighbors.map(name => `<span class="plain">${name}</span>`);
        const all = [...linked, ...plain];
        return all.length ? all.join(', ') : '<span class="muted">No land border</span>';
    }

    function renderClosestFlowing(closest) {
        return closest.length
            ? closest.map(c => `<a href="/countries/${c.id}">${c.name}</a>`).join(', ')
            : '<span class="muted">None</span>';
    }

    Promise.all([
        fetch(`/api/countries/${id}/profile`).then(res => {
            if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
            return res.json();
        }),
        fetch(`/api/countries/${id}/neighbors`).then(res => res.json()),
        fetch(`/api/countries/${id}/nearby`).then(res => res.json()),
        fetchFavoriteIds()
    ])
        .then(([profile, neighbors, nearby, favoriteIds]) => {
            const c = profile.country;
            document.getElementById('loading').remove();

            const areaText = profile.areaSquareKm
                ? `${Math.round(profile.areaSquareKm).toLocaleString()} km²`
                : 'Unknown';

            const wrap = document.getElementById('content');
            wrap.insertAdjacentHTML('beforeend', `
                    <div class="title-row">
                        <h1>${c.name}</h1>
                        ${starButton(c.id, favoriteIds.has(c.id))}
                    </div>
                    <div class="meta-line">Area: ${areaText}</div>
                    <div class="badges">
                        <span class="badge ${c.euMember ? 'yes' : 'no'}">EU</span>
                        <span class="badge ${c.schengenMember ? 'yes' : 'no'}">Schengen</span>
                        <span class="badge ${c.eurozoneMember ? 'yes' : 'no'}">Eurozone</span>
                        <span class="badge ${c.natoMember ? 'yes' : 'no'}">NATO</span>
                    </div>

                    <section>
                        <h2>Neighbors</h2>
                        <div class="flowing-list">${renderNeighborsFlowing(neighbors)}</div>
                    </section>

                    <section>
                        <h2>Closest countries</h2>
                        <div class="flowing-list">${renderClosestFlowing(nearby)}</div>
                    </section>

                    <section>
                        <h2>Political parties</h2>
                        ${profile.politicalParties.length ? profile.politicalParties.map(p =>
                row(p.name, p.politicalGroup || '')).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Elections</h2>
                        ${profile.elections.length ? profile.elections.map(e =>
                row(e.name, e.electionDate)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>MEPs</h2>
                        ${profile.meps.length ? profile.meps.map(m =>
                row(m.fullName, m.politicalGroup || '')).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Political events</h2>
                        ${profile.politicalEvents.length ? profile.politicalEvents.map(e =>
                row(e.title, e.eventDate)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Statistics</h2>
                        ${profile.statistics.length ? profile.statistics.map(s =>
                row(`${s.indicator} (${s.year})`, `${s.value ?? ''} ${s.unit || ''}`)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Languages</h2>
                        ${profile.languages.length ? profile.languages.map(l =>
                row(l.language, l.official ? 'Official' : (l.minority ? 'Minority' : ''))).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>
                `);
        })
        .catch(err => {
            document.getElementById('loading').textContent = `Couldn't load: ${err.message}`;
        });
</script>
</body>
</html>
