<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — Country</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean: #1c2b3a;
            --ocean-deep: #121b24;
            --land-eu: #b8945f;
            --land-base: #9c9186;
            --cream: #ede7da;
        }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 90px 24px 80px; }
        .title-row { display: flex; align-items: center; gap: 14px; margin: 10px 0 6px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 36px; margin: 0; }
        .meta-line { font-size: 13px; opacity: 0.6; margin-bottom: 20px; }
        .badges { display: flex; gap: 8px; margin-bottom: 32px; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 3px; background: var(--ocean-deep); }
        .badge.yes { color: var(--land-eu); }
        .badge.no { color: #6b7378; }
        section { margin-bottom: 36px; }
        section h2 { font-family: 'Source Serif 4', serif; font-size: 20px; border-bottom: 1px solid rgba(237,231,218,0.15); padding-bottom: 8px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(237,231,218,0.06); }
        .row .muted { color: #9aa3a8; }
        .row .pending-tag { font-style: italic; opacity: 0.7; font-size: 12px; }
        .row a { color: var(--land-eu); text-decoration: none; }
        .flowing-list a { color: var(--land-eu); text-decoration: none; }
        .flowing-list span.plain { color: var(--cream); opacity: 0.8; }
        .empty { color: #6b7378; font-size: 14px; font-style: italic; }
        .hemicycle { width: 100%; max-width: 440px; height: auto; display: block; }
        .hemicycle-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; }
        .hemicycle-legend-item { display: flex; align-items: center; gap: 6px; }
        .hemicycle-legend-item .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
        .hemicycle-total { font-size: 12px; opacity: 0.6; margin-top: 6px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<script src="/js/auth.js"></script>
<div class="wrap" id="content">
    <div id="loading">Loading...</div>
</div>

<div id="country-id-holder" th:attr="data-country-id=${countryId}" style="display:none"></div>

<script>
    const id = document.getElementById('country-id-holder').dataset.countryId;

    function row(label, value) {
        return `<div class="row"><span class="muted">${label}</span><span>${value}</span></div>`;
    }

    function pendingElectionRow(e) {
        const link = e.sourceUrl ? ` &middot; <a href="${e.sourceUrl}" target="_blank" rel="noopener">source</a>` : '';
        return `<div class="row"><span class="muted">${e.title} <span class="pending-tag">(result pending)</span></span><span>${e.eventDate}${link}</span></div>`;
    }

    function renderNeighborsFlowing(neighbors) {
        const linked = neighbors.neighborsInDataset.map(n => `<a href="/countries/${n.id}">${n.name}</a>`);
        const plain = neighbors.otherRealWorldNeighbors.map(name => `<span class="plain">${name}</span>`);
        const all = [...linked, ...plain];
        return all.length ? all.join(', ') : '<span class="muted">No land border</span>';
    }

    function renderClosestFlowing(closest) {
        return closest.length
            ? closest.map(c => `<a href="/countries/${c.id}">${c.name}</a>`).join(', ')
            : '<span class="muted">None</span>';
    }

    // Same 7-stop red-to-blue scale used on the map's leaning layer, applied
    // continuously so each party's own left-right score gets its own shade.
    function colorForLeftRight(value) {
        if (value == null) return '#9c9186';
        const stops = ['#8b2635', '#b23a4e', '#d68a95', '#e0d5bd', '#8aa8c4', '#4a7ba6', '#234b6e'];
        const t = Math.max(0, Math.min(1, value / 10));
        const scaled = t * (stops.length - 1);
        const idx = Math.min(Math.floor(scaled), stops.length - 2);
        const frac = scaled - idx;
        return blendHex(stops[idx], stops[idx + 1], frac);
    }

    function blendHex(a, b, t) {
        const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
        const ar = (ah >> 16) & 255, ag = (ah >> 8) & 255, ab = ah & 255;
        const br = (bh >> 16) & 255, bg = (bh >> 8) & 255, bb = bh & 255;
        const r = Math.round(ar + (br - ar) * t);
        const g = Math.round(ag + (bg - ag) * t);
        const bl = Math.round(ab + (bb - ab) * t);
        return `#${[r, g, bl].map(x => x.toString(16).padStart(2, '0')).join('')}`;
    }

    function polarPoint(cx, cy, r, angleDeg) {
        const rad = angleDeg * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
    }

    // Half-donut wedge from startAngle to endAngle (180=left, 90=top, 0=right).
    function wedgePath(cx, cy, rOuter, rInner, startAngle, endAngle) {
        const p1 = polarPoint(cx, cy, rOuter, startAngle);
        const p2 = polarPoint(cx, cy, rOuter, endAngle);
        const p3 = polarPoint(cx, cy, rInner, endAngle);
        const p4 = polarPoint(cx, cy, rInner, startAngle);
        const largeArc = (startAngle - endAngle) > 180 ? 1 : 0;
        return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)} A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)} Z`;
    }

    function renderHemicycle(composition) {
        const total = composition.reduce((sum, p) => sum + (p.seats || 0), 0);
        if (total === 0) return '<div class="empty">No seat data</div>';

        // Left-to-right by ideology, matching real hemicycle seating convention.
        const sorted = [...composition].sort((a, b) => {
            if (a.leftRight == null && b.leftRight == null) return 0;
            if (a.leftRight == null) return 1;
            if (b.leftRight == null) return -1;
            return a.leftRight - b.leftRight;
        });

        const cx = 220, cy = 190, rOuter = 180, rInner = 80;
        let angle = 180;
        const wedges = sorted.map(p => {
            const span = (p.seats / total) * 180;
            const start = angle;
            const end = angle - span;
            angle = end;
            const path = wedgePath(cx, cy, rOuter, rInner, start, end);
            return `<path d="${path}" fill="${colorForLeftRight(p.leftRight)}" stroke="#1c2b3a" stroke-width="1"><title>${p.partyName}: ${p.seats} seats</title></path>`;
        }).join('');

        const legend = sorted.map(p => `
                <div class="hemicycle-legend-item">
                    <span class="swatch" style="background: ${colorForLeftRight(p.leftRight)}"></span>
                    <span>${p.partyShortName || p.partyName} &mdash; ${p.seats}</span>
                </div>
            `).join('');

        return `
                <svg viewBox="0 0 440 200" class="hemicycle">${wedges}</svg>
                <div class="hemicycle-legend">${legend}</div>
                <div class="hemicycle-total">${total} seats total</div>
            `;
    }

    Promise.all([
        fetch(`/api/countries/${id}/profile`).then(res => {
            if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
            return res.json();
        }),
        fetch(`/api/countries/${id}/neighbors`).then(res => res.json()),
        fetch(`/api/countries/${id}/nearby`).then(res => res.json()),
        fetchFavoriteIds()
    ])
        .then(([profile, neighbors, nearby, favoriteIds]) => {
            const c = profile.country;
            document.getElementById('loading').remove();

            const areaText = profile.areaSquareKm
                ? `${Math.round(profile.areaSquareKm).toLocaleString()} km²`
                : 'Unknown';

            const pendingElections = profile.politicalEvents.filter(e => e.eventType === 'ELECTION_HELD');
            const hasElectionData = profile.elections.length || pendingElections.length;
            const hasStatus = c.currentRulingParty || c.currentPoliticalLeaningLabel || c.currentParliamentLeaningLabel;

            const wrap = document.getElementById('content');
            wrap.insertAdjacentHTML('beforeend', `
                    <div class="title-row">
                        <h1>${c.name}</h1>
                        ${starButton(c.id, favoriteIds.has(c.id))}
                    </div>
                    <div class="meta-line">Area: ${areaText}</div>
                    <div class="badges">
                        <span class="badge ${c.euMember ? 'yes' : 'no'}">EU</span>
                        <span class="badge ${c.schengenMember ? 'yes' : 'no'}">Schengen</span>
                        <span class="badge ${c.eurozoneMember ? 'yes' : 'no'}">Eurozone</span>
                        <span class="badge ${c.natoMember ? 'yes' : 'no'}">NATO</span>
                    </div>

                    ${hasStatus ? `
                        <section>
                            <h2>Current status</h2>
                            ${c.currentRulingParty ? row(c.currentRulingParty.includes(',') ? 'Governing coalition' : 'Governed by', c.currentRulingParty) : ''}
                            ${c.currentPoliticalLeaningLabel ? row('Government leaning', `${c.currentPoliticalLeaningLabel}${c.currentPoliticalLeaning != null ? ' (' + c.currentPoliticalLeaning + ')' : ''}`) : ''}
                            ${c.currentParliamentLeaningLabel ? row('Parliament leaning', `${c.currentParliamentLeaningLabel}${c.currentParliamentLeaning != null ? ' (' + c.currentParliamentLeaning + ')' : ''}`) : ''}
                        </section>
                    ` : ''}

                    ${profile.currentComposition.length ? `
                        <section>
                            <h2>Parliament composition</h2>
                            ${renderHemicycle(profile.currentComposition)}
                        </section>
                    ` : ''}

                    <section>
                        <h2>Neighbors</h2>
                        <div class="flowing-list">${renderNeighborsFlowing(neighbors)}</div>
                    </section>

                    <section>
                        <h2>Closest countries</h2>
                        <div class="flowing-list">${renderClosestFlowing(nearby)}</div>
                    </section>

                    <section>
                        <h2>Political parties</h2>
                        ${profile.politicalParties.length ? profile.politicalParties.map(p =>
                row(p.name, p.politicalGroup || '')).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Elections</h2>
                        ${profile.elections.map(e => row(e.name, e.electionDate)).join('')}
                        ${pendingElections.map(pendingElectionRow).join('')}
                        ${hasElectionData ? '' : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>MEPs</h2>
                        ${profile.meps.length ? profile.meps.map(m =>
                row(m.fullName, m.politicalGroup || '')).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Political events</h2>
                        ${profile.politicalEvents.length ? profile.politicalEvents.map(e =>
                row(e.title, e.eventDate)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Statistics</h2>
                        ${profile.statistics.length ? profile.statistics.map(s =>
                row(`${s.indicator} (${s.year})`, `${s.value ?? ''} ${s.unit || ''}`)).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>

                    <section>
                        <h2>Languages</h2>
                        ${profile.languages.length ? profile.languages.map(l =>
                row(l.language, l.official ? 'Official' : (l.minority ? 'Minority' : ''))).join('') : '<div class="empty">None recorded yet</div>'}
                    </section>
                `);
        })
        .catch(err => {
            document.getElementById('loading').textContent = `Couldn't load: ${err.message}`;
        });
</script>
</body>
</html>
