<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — News</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --ocean: #1c2b3a; --ocean-deep: #121b24; --land-eu: #b8945f; --cream: #ede7da; }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 90px 24px 80px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 32px; margin-bottom: 8px; }
        .subtitle { font-size: 13px; opacity: 0.6; margin-bottom: 24px; }
        .controls { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
        .controls input, .controls select {
            background: var(--ocean-deep); border: 1px solid rgba(237,231,218,0.15);
            color: var(--cream); padding: 8px 12px; border-radius: 3px; font-size: 13px;
            font-family: 'IBM Plex Sans', sans-serif;
        }
        .controls input { flex: 1; min-width: 180px; }
        .controls input::placeholder { color: #7a838a; }
        .post { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid rgba(237,231,218,0.08); }
        .post .flag { width: 44px; height: 30px; object-fit: cover; border-radius: 3px; flex-shrink: 0; margin-top: 2px; background: rgba(237,231,218,0.08); }
        .post .body { flex: 1; min-width: 0; }
        .post .meta { font-size: 11px; opacity: 0.6; margin-bottom: 6px; }
        .post .title { font-size: 16px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
        .post .snippet { font-size: 13px; opacity: 0.75; line-height: 1.5; margin-bottom: 8px; }
        .post .links a { font-size: 12px; color: var(--land-eu); text-decoration: none; }
        .sentinel { height: 1px; }
        .loading-more { text-align: center; font-size: 13px; opacity: 0.6; padding: 20px 0; }
        .empty { color: #6b7378; font-style: italic; padding: 20px 0; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<div class="wrap">
    <h1>News</h1>
    <div class="subtitle">News from across Europe and the EU institutions, newest first.</div>

    <div class="controls">
        <input type="text" id="search-input" placeholder="Search titles...">
        <input type="date" id="date-from-input" title="From date">
        <input type="date" id="date-to-input" title="To date">
        <select id="country-select"><option value="">All countries</option></select>
    </div>

    <div id="content">Loading...</div>
    <div class="sentinel" id="sentinel"></div>
    <div class="loading-more" id="loading-more" style="display: none;">Loading more...</div>
</div>

<script>
    const LIMIT = 20;
    let offset = 0;
    let loading = false;
    let finished = false;
    let itemCount = 0;
    let debounceTimer = null;

    function buildQuery() {
        const params = new URLSearchParams({ offset: String(offset), limit: String(LIMIT) });
        const search = document.getElementById('search-input').value.trim();
        const country = document.getElementById('country-select').value;
        const dateFrom = document.getElementById('date-from-input').value;
        const dateTo = document.getElementById('date-to-input').value;
        if (search) params.set('search', search);
        if (country) params.set('countryId', country);
        if (dateFrom) params.set('dateFrom', dateFrom);
        if (dateTo) params.set('dateTo', dateTo);
        return params.toString();
    }

    function flagFor(item) {
        if (item.countryIsoCode) {
            return `<img class="flag" src="https://flagcdn.com/w80/${item.countryIsoCode.toLowerCase()}.png" alt="">`;
        }
        return `<img class="flag" src="https://flagcdn.com/w80/eu.png" alt="EU">`;
    }

    function renderPost(item) {
        return `
                <div class="post">
                    ${flagFor(item)}
                    <div class="body">
                        <div class="meta">${item.date}${item.countryName ? ` &middot; ${item.countryName}` : ' &middot; EU'}${item.sourceName ? ` &middot; ${item.sourceName}` : ''}</div>
                        <div class="title">${item.title}</div>
                        ${item.description ? `<div class="snippet">${item.description}</div>` : ''}
                        <div class="links">
                            ${item.sourceUrl ? `<a href="${item.sourceUrl}" target="_blank" rel="noopener">Read more &#8599;</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
    }

    function loadMore() {
        if (loading || finished) return;
        loading = true;
        if (itemCount > 0) document.getElementById('loading-more').style.display = 'block';

        fetch(`/api/news?${buildQuery()}`)
            .then(res => {
                if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
                return res.json();
            })
            .then(data => {
                document.getElementById('loading-more').style.display = 'none';

                if (itemCount === 0 && data.items.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="empty">No matching news found.</div>';
                    finished = true;
                    return;
                }

                if (itemCount === 0) {
                    document.getElementById('content').innerHTML = '';
                }

                data.items.forEach(item => {
                    document.getElementById('content').insertAdjacentHTML('beforeend', renderPost(item));
                    itemCount++;
                });

                offset += data.items.length;
                finished = !data.hasMore;
                loading = false;
            })
            .catch(err => {
                loading = false;
                document.getElementById('loading-more').style.display = 'none';
                if (itemCount === 0) {
                    document.getElementById('content').innerHTML = `<div class="empty">Couldn't load: ${err.message}</div>`;
                }
            });
    }

    function resetAndReload() {
        offset = 0;
        itemCount = 0;
        finished = false;
        document.getElementById('content').innerHTML = 'Loading...';
        loadMore();
    }

    document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(resetAndReload, 350);
    });
    document.getElementById('country-select').addEventListener('change', resetAndReload);
    document.getElementById('date-from-input').addEventListener('change', resetAndReload);
    document.getElementById('date-to-input').addEventListener('change', resetAndReload);

    fetch('/api/countries')
        .then(res => res.json())
        .then(countries => {
            const select = document.getElementById('country-select');
            countries.sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
                select.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.name}</option>`);
            });
        });

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
            loadMore();
        }
    });
    observer.observe(document.getElementById('sentinel'));
</script>
</body>
</html>
