<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EuroPolitik — Log in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --ocean: #1c2b3a; --ocean-deep: #121b24; --land-eu: #b8945f; --cream: #ede7da; }
        body { margin: 0; background: var(--ocean); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
        .wrap { max-width: 380px; margin: 0 auto; padding: 120px 24px 80px; }
        h1 { font-family: 'Source Serif 4', serif; font-size: 28px; margin-bottom: 24px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-bottom: 2px solid rgba(237,231,218,0.15); opacity: 0.6; font-size: 14px; }
        .tab.active { border-bottom-color: var(--land-eu); opacity: 1; color: var(--land-eu); }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 12px; border-radius: 3px; border: 1px solid rgba(237,231,218,0.25); background: var(--ocean-deep); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
        button { width: 100%; padding: 10px; border-radius: 3px; border: none; background: var(--land-eu); color: var(--ocean-deep); font-weight: 500; cursor: pointer; font-size: 14px; }
        .msg { font-size: 13px; margin-top: 12px; color: #c97a7a; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<script src="/js/auth.js"></script>

<div class="wrap">
    <h1>Account</h1>
    <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">Log in</div>
        <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="submit-btn" onclick="submitForm()">Log in</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    let mode = 'login';

    function switchTab(newMode) {
        mode = newMode;
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
        document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        document.getElementById('submit-btn').textContent = mode === 'login' ? 'Log in' : 'Register';
        document.getElementById('msg').textContent = '';
    }

    function submitForm() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');

        if (!username || !password) {
            msg.textContent = 'Username and password are both required.';
            return;
        }

        fetch(`/api/auth/${mode}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
            .then(res => {
                if (!res.ok) return res.json().then(err => { throw new Error(err.message || 'Request failed'); });
                return res.json();
            })
            .then(data => {
                setAuth(data.token, data.username);
                window.location.href = '/account';
            })
            .catch(err => {
                msg.textContent = err.message;
            });
    }
</script>
</body>
</html>
