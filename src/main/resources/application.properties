spring.application.name=EuroPolitik

spring.datasource.url=jdbc:postgresql://localhost:5432/europolitik
spring.datasource.username=europolitik
spring.datasource.password=europolitik

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing secret (at least 32 characters). Set JWT_SECRET in every real
# environment. The default below is for local development only, and the app
# refuses to start with it when the "prod" profile is active.
europolitik.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-outside-local-development-0000}

# European Parliament Open Data API (MEP importer)
europolitik.import.ep.base-url=https://data.europarl.europa.eu/api/v2
europolitik.import.ep.mep.cron=0 0 */6 * * *

# HTTP client timeouts, applied to the auto-configured RestClient.Builder
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s

# Eurostat Statistics API (population importer)
europolitik.import.eurostat.base-url=https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
europolitik.import.eurostat.population.cron=0 0 3 * * MON
europolitik.import.eurostat.unemployment.cron=0 0 4 * * MON
europolitik.import.parlgov.cron=0 0 3 1 * *
europolitik.import.wikidata.base-url=https://query.wikidata.org/sparql
#europolitik.import.wikidata.composition.cron=0 0 6 * * *
europolitik.import.wikipedia.base-url=https://en.wikipedia.org/w/api.php
# Was every minute -- overlapping runs kept hammering Wikipedia and never
# finished a pass (see WikipediaClient User-Agent fix). Every 15 min is
# still fast for active dev; move to something like every 6-24h once deployed.
europolitik.import.wikipedia.ruling-party.cron=0 0 3 1 * *
europolitik.import.political-leaning.cron=0 0 3 1 * *
europolitik.import.election-discovery.cron=0 0 3 1 * *
europolitik.import.eurostat.gdp.cron=0 0 3 1 * *
#europolitik.import.parliament-leaning.cron=0 35 7 * * *
europolitik.import.languages.cron=0 0 2 1 1 *
europolitik.import.gdelt.base-url=https://api.gdeltproject.org/api/v2/doc/doc
europolitik.import.news.cron=0 0 */6 * * *

# Let a slow job (for example GDELT retries) run without blocking the others
spring.task.scheduling.pool.size=2

# Feed (map sidebar + /timeline)
europolitik.feed.limit=10
europolitik.feed.recency-months=18
europolitik.import.eu-rss.council-url=https://www.consilium.europa.eu/en/rss/pressreleases.ashx
europolitik.import.eu-rss.cron=0 0 * * * *